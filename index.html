<body>
<div id="app"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,collection,query,orderBy,limit,getDocs,updateDoc,deleteDoc,where,writeBatch,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== 1) PEGA AQUÍ LA CONFIGURACIÓN DE TU PROYECTO FIREBASE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBAjqey7jSRWnDYgGLIKA_U9p_yhsuwkSg",
  authDomain: "nepo-location.firebaseapp.com",
  projectId: "nepo-location",
  storageBucket: "nepo-location.firebasestorage.app",
  messagingSenderId: "759721708765",
  appId: "1:759721708765:web:dda2298cc7b062df269f34"
};
/* =================================================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? d.toLocaleString("es-CL", {dateStyle:"short", timeStyle:"medium"}).replace(/[\u202f\u00a0]/g, " ") : "";
const toast = m => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); };
let me = null, stream = null, watchId = null, pos = null, posT = 0, records = [];

/* ---------- Sesión ---------- */
onAuthStateChanged(auth, async u => {
  stopMedia();
  if (!u) { me = null; return viewLogin(); }
  try {
    const s = await getDoc(doc(db, "users", u.uid));
    if (!s.exists() || !s.data().active) { await signOut(auth); return viewLogin("Usuario no autorizado o desactivado."); }
    me = {uid: u.uid, ...s.data()}; localStorage.setItem("nepo-me", JSON.stringify(me));
    shell(); syncQueue();
  } catch (e) {
    let c = null; try { c = JSON.parse(localStorage.getItem("nepo-me")); } catch {}
    if (c && c.uid === u.uid && e.code !== "permission-denied") { me = c; shell(); toast("Modo sin conexión"); }
    else { await signOut(auth); viewLogin("No se pudo validar tu perfil."); }
  }
});

function viewLogin(msg = "") {
  document.body.className = "lg";
  $("#app").innerHTML = `<div class="card login"><img src="logo.jpg" alt="NEPO Security" style="display:block;margin:0 auto">
  <h2 style="text-align:center;margin:0">Sistema de Georreferenciación</h2>
  <p style="text-align:center;margin:.2rem 0 0;font-size:.9rem">Control de presencia en terreno</p>
  <div class="chips"><span>✓ GPS verificado</span><span>✓ Foto en vivo</span><span>✓ Registro inalterable</span></div>
  <label>Correo</label><input id="em" type="email" autocomplete="username" placeholder="nombre@empresa.cl">
  <label>Contraseña</label><div class="pw"><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" id="eye" aria-label="Mostrar u ocultar contraseña">Ver</button></div>
  <p class="err" id="err">${esc(msg)}</p><button id="go" style="width:100%">Ingresar</button><button type="button" class="alt inst hide" style="width:100%;margin-top:.6rem">Instalar app en tu celular</button>
  <p class="hint" style="text-align:center;margin-top:1rem">🔒 Conexión cifrada · ¿Olvidaste tu clave? Contacta a tu administrador.</p></div>`;
  const go = async () => {
    $("#err").textContent = ""; $("#go").disabled = true; $("#go").textContent = "Ingresando…";
    try { await signInWithEmailAndPassword(auth, $("#em").value.trim(), $("#pw").value); }
    catch { $("#err").textContent = "Correo o contraseña incorrectos."; $("#go").disabled = false; $("#go").textContent = "Ingresar"; }
  };
  $("#go").onclick = go; $("#pw").onkeydown = e => { if (e.key === "Enter") go(); };
  showInstall(); $("#eye").onclick = () => { const i = $("#pw"); i.type = i.type === "password" ? "text" : "password"; $("#eye").textContent = i.type === "password" ? "Ver" : "Ocultar"; };
}

function shell() {
  const admin = me.role === "admin";
  document.body.className = admin ? "adm" : "";
  $("#app").innerHTML = `<header><img src="logo.jpg" alt=""><div class="brand"><b>NEPO SECURITY</b><span>SISTEMA DE GEORREFERENCIACIÓN</span></div><span class="sp"></span><span id="net" class="net"></span>
    <small class="who">${esc(me.name)} · ${admin ? "Administrador" : "Guardia"}</small><button class="alt sm inst hide">Instalar app</button><button class="alt sm" id="out">Salir</button></header>
    <main>${admin ? `<div class="tabs"><button data-t="rec" class="on">Registros</button><button data-t="map">Mapas</button><button data-t="usr">Usuarios</button><button data-t="mark">Marcar</button></div>` : ""}<div id="v"></div><footer class="foot">© ${new Date().getFullYear()} NEPO Security · Sistema de Georreferenciación<br><button class="alt sm inst hide" style="margin-top:.6rem">Instalar app en este dispositivo</button></footer></main>`;
  $("#out").onclick = async () => {
    if ((await qAll()).some(i => i.meta.uid === me.uid) && !confirm("Tienes fotos pendientes de subir. Si sales, se subirán cuando vuelvas a ingresar con conexión. ¿Salir igual?")) return;
    signOut(auth); };
  netBadge(); showInstall();
  const show = t => { stopMedia(); document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    ({rec: viewRecords, map: viewMaps, usr: viewUsers, mark: viewMark})[t](); };
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.t));
  show(admin ? "rec" : "mark");
}

/* ---------- Marcar presencia (guardia) ---------- */
function stopMedia() {
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; pos = null;
}

async function viewMark() {
  if (navigator.onLine) { try { const p = await getDoc(doc(db, "users", me.uid)); if (p.exists()) { me = {uid: me.uid, ...p.data()}; localStorage.setItem("nepo-me", JSON.stringify(me)); } } catch {} }
  const sites = (await loadSites()).filter(x => me.role === "admin" || (me.sites || []).includes(x.name)); gmP = null; gPosM = null; mapSig = null; cpSig = null; cps = []; userPicked = false;
  $("#v").innerHTML = `<div class="card"><h2>Registrar presencia</h2><p class="hint">Apunta al lugar y toca el botón. Si no hay internet, la foto se guarda y se sube sola.</p>
    <video id="cam" autoplay playsinline muted></video><img id="shot" class="shot hide" alt="">
    <div class="gps"><span class="dot" id="gd"></span><span id="gt">Buscando ubicación GPS…</span></div>
    <label>Instalación</label><select id="site"><option value="">Elige la instalación…</option>${sites.map(x => `<option>${esc(x.name)}</option>`).join("")}</select>
    <div id="cps" class="hide"><div id="cpd" class="banner"></div><label>Punto de control</label><select id="cp"></select>
    <details id="mapd" style="margin:.6rem 0"><summary>Ver mapa</summary><div id="gmap" style="height:230px;border-radius:10px;margin-top:.4rem"></div></details></div>
    <details style="margin:.6rem 0"><summary>Agregar observación (opcional)</summary><textarea id="note" rows="2" maxlength="300" style="margin-top:.4rem"></textarea></details>
    <p class="err" id="merr"></p>
    <div class="row cta"><button id="snap" disabled>Tomar foto y registrar</button><button id="again" class="alt hide">Nuevo registro</button></div></div>
    <div id="queue"></div><h3>Mis últimos registros</h3><div class="grid" id="mine"></div>`;
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1280}}, audio: false}); $("#cam").srcObject = stream; }
  catch { $("#merr").textContent = "Debes permitir el acceso a la cámara (requiere conexión HTTPS)."; }
  if (!navigator.geolocation) { $("#gt").textContent = "Este dispositivo no tiene GPS."; }
  else watchId = navigator.geolocation.watchPosition(p => {
    pos = p.coords; posT = p.timestamp || Date.now(); const good = pos.accuracy <= 50;
    $("#gd").className = "dot " + (good ? "ok" : ""); 
    $("#gt").textContent = good ? `GPS listo · precisión ±${Math.round(pos.accuracy)} m` : `Mejorando precisión del GPS… (±${Math.round(pos.accuracy)} m)`;
    $("#snap").disabled = !stream; paintCps();
  }, () => { $("#gd").className = "dot bad"; $("#gt").textContent = pos ? `Sin señal GPS reciente (última ubicación hace ${Math.round((Date.now() - posT) / 1000)} s)` : "Activa el permiso de ubicación y sal a un lugar abierto."; }, {enableHighAccuracy: true, maximumAge: 0, timeout: 20000});
  $("#snap").onclick = capture; $("#site").onchange = e => { localStorage.setItem("nepo-site", e.target.value); userPicked = false; loadCps(e.target.value); };
  $("#cp").onchange = () => { userPicked = true; paintCps(true); };
  $("#mapd").ontoggle = () => { fitMap = true; gm?.invalidateSize(); paintCps(true); };
  const last = localStorage.getItem("nepo-site"), pick = sites.find(x => x.name === last) ? last : sites.length === 1 ? sites[0].name : "";
  if (pick) { $("#site").value = pick; loadCps(pick); }
  if (!sites.length) $("#merr").textContent = "No tienes instalaciones asignadas. Pide a tu administrador que te asigne una.";
  $("#again").onclick = viewMark;
  if (navigator.onLine) sites.forEach(x => fetchCps(x.name));
  paintQueue(); loadMine();
}

async function reverse(lat, lon) {
  try {
    const c = new AbortController(); setTimeout(() => c.abort(), 4000);
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=es`, {signal: c.signal});
    return (await r.json()).display_name || "";
  } catch { return ""; }
}

/* ---------- Cola local (IndexedDB) ---------- */
const idb = () => new Promise((ok, no) => { const r = indexedDB.open("nepo-q", 1); r.onupgradeneeded = () => r.result.createObjectStore("q", {keyPath: "id"}); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const qTx = async (mode, fn) => { const d = await idb(); return new Promise((ok, no) => { const t = d.transaction("q", mode), r = fn(t.objectStore("q")); t.oncomplete = () => ok(r?.result); t.onerror = () => no(t.error); }); };
const qPut = it => qTx("readwrite", s => s.put(it)), qDel = id => qTx("readwrite", s => s.delete(id)), qAll = () => qTx("readonly", s => s.getAll()).then(x => x || []);
const netBadge = () => { const e = $("#net"); if (!e) return; const on = navigator.onLine; e.textContent = on ? "En línea" : "Sin conexión"; e.style.background = on ? "#ffffff26" : "var(--gold)"; e.style.color = on ? "#fff" : "#222"; };

async function cached(key, fn) {
  if (navigator.onLine) { try { const v = await Promise.race([fn(), new Promise((_, no) => setTimeout(no, 7000))]); localStorage.setItem(key, JSON.stringify(v)); return v; } catch {} }
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; }
}
const fetchCps = site => cached("nepo-cps-" + site, async () => (await getDocs(query(collection(db, "checkpoints"), where("site", "==", site)))).docs.map(d => ({id: d.id, ...d.data()})));

let syncing = false;
async function syncQueue() {
  if (syncing || !me || !navigator.onLine) return paintQueue();
  syncing = true;
  try { for (const it of await qAll()) {
    if (it.meta.uid !== me.uid) continue;
    it.status = "subiendo"; await qPut(it); paintQueue();
    try {
      const m = it.meta, addr = m.address || await reverse(m.lat, m.lng);
      let verifOk = null, verifDist = null;
      if (m.cpId) { try { const c = (await getDoc(doc(db, "checkpoints", m.cpId))).data();
        if (c) { verifDist = Math.round(hav(m.lat, m.lng, c.lat, c.lng)); verifOk = verifDist - m.acc <= c.radius; } } catch {} }
      const b = writeBatch(db);
      b.set(doc(db, "checkins", it.id), {...m, address: addr, thumb: it.thumb, hash: it.hash, size: it.size, diferido: Date.now() - it.queuedAt > 60000, verifOk, verifDist, createdAt: serverTimestamp()});
      b.set(doc(db, "stats", "usage"), {bytes: increment(it.size), count: increment(1)}, {merge: true});
      b.set(doc(db, "checkinPhotos", it.id), {uid: me.uid, photo: it.photo});
      await Promise.race([b.commit(), new Promise((_, no) => setTimeout(() => no({code: "timeout"}), 25000))]);
      await qDel(it.id);
    } catch (e) {
      let done = false; try { done = (await getDoc(doc(db, "checkins", it.id))).exists(); } catch {}
      if (done) await qDel(it.id); else { it.status = e.code === "timeout" ? "pendiente" : "error"; await qPut(it); }
    }
    paintQueue();
  } } finally { syncing = false; }
  paintQueue(); loadMine();
}

async function paintQueue() {
  const el = $("#queue"); if (!el || !me) return;
  const items = (await qAll()).filter(i => i.meta.uid === me.uid).sort((a, b) => a.queuedAt - b.queuedAt);
  queuedCps = new Set(items.filter(i => i.meta.cpId && dayKey({createdAt: {toDate: () => new Date(i.meta.deviceTime)}}) === today()).map(i => i.meta.cpId));
  el.innerHTML = items.length ? `<div class="card" style="border-left:4px solid var(--gold)"><div class="row" style="align-items:center"><h3 style="margin:0;flex:2">Pendientes de subir (${items.length})</h3><button class="sm" id="qs">Subir ahora</button></div>
    <p class="hint">${navigator.onLine ? "Subiendo cuando hay señal." : "Sin conexión: las fotos están guardadas en el celular."} Se envían solas al recuperar internet. Verificaremos la ubicación al subirlas.</p>
    <div class="grid">${items.map(i => `<div class="rec" style="cursor:default"><img src="${i.thumb}" alt=""><div><b>${esc(i.meta.cpName || i.meta.site)}</b><br>${fmt(new Date(i.meta.deviceTime))}<br>
    <span class="tag ${i.status === "error" ? "off" : ""}">${i.status === "subiendo" && syncing ? "Subiendo…" : i.status === "error" ? "Error · se reintentará" : "Pendiente"}</span></div></div>`).join("")}</div></div>` : "";
  if ($("#qs")) $("#qs").onclick = syncQueue;
  paintCps(true);
}

async function capture() {
  if (!pos || !stream) return;
  const age = Math.round((Date.now() - posT) / 1000);
  if (age > 600) return $("#merr").textContent = "Sin señal GPS reciente. Sal a un lugar abierto y espera el punto verde.";
  const site = $("#site").value;
  if (!site) return $("#merr").textContent = "Elige la instalación antes de registrar.";
  const cp = cps.find(c => c.id === $("#cp").value);
  if (cps.length && !cp) return $("#merr").textContent = "Elige el punto de control donde estás.";
  const dd = cp ? hav(pos.latitude, pos.longitude, cp.lat, cp.lng) : null;
  if (cp && dd - pos.accuracy > cp.radius) return $("#merr").textContent = `Estás a ${Math.round(dd)} m del punto. Acércate a menos de ${cp.radius} m para registrar.`;
  $("#snap").disabled = true; $("#merr").textContent = "";
  const v = $("#cam"), {latitude: lat, longitude: lon, accuracy: acc} = pos, online = navigator.onLine;
  const now = new Date(), address = online ? await reverse(lat, lon) : "", note = $("#note").value.trim();
  const w = Math.min(v.videoWidth, 960), h = Math.round(w * v.videoHeight / v.videoWidth);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const x = cv.getContext("2d"); x.drawImage(v, 0, 0, w, h);
  const lines = [`NEPO SECURITY · ${me.name} · ${site}`, now.toLocaleString("es-CL", {dateStyle: "medium", timeStyle: "medium"}),
    `${lat.toFixed(6)}, ${lon.toFixed(6)} (±${Math.round(acc)} m)`, address.slice(0, 140), cp && `Punto: ${cp.name} (a ${Math.round(dd)} m)`,
    age > 30 && `GPS: última ubicación conocida (hace ${age} s)`, !online && "SIN CONEXIÓN · se enviará al recuperar señal"].filter(Boolean);
  const fs = Math.max(15, Math.round(Math.min(w, h * 1.2) / 38));
  x.font = `${fs}px system-ui,sans-serif`;
  const wrap = t => { const out = []; let cur = ""; for (const wd of t.split(" ")) { const nx = cur ? cur + " " + wd : wd;
    if (x.measureText(nx).width > w - 20 && cur) { out.push(cur); cur = wd; } else cur = nx; } out.push(cur); return out; };
  const wl = lines.flatMap(wrap), bh = fs * 1.35 * wl.length + 14;
  x.fillStyle = "rgba(18,48,106,.86)"; x.fillRect(0, h - bh, w, bh);
  x.fillStyle = "#B8984A"; x.fillRect(0, h - bh, w, 3);
  x.fillStyle = "#fff"; x.font = `bold ${fs}px system-ui,sans-serif`; x.textBaseline = "top";
  wl.forEach((l, i) => x.fillText(l, 10, h - bh + 9 + i * fs * 1.35));
  let q = .7, photo = cv.toDataURL("image/jpeg", q);
  while (photo.length > 480000 && q > .3) { q -= .1; photo = cv.toDataURL("image/jpeg", q); }
  const tc = document.createElement("canvas"); tc.width = 360; tc.height = Math.round(360 * h / w);
  tc.getContext("2d").drawImage(cv, 0, 0, tc.width, tc.height);
  const thumb = tc.toDataURL("image/jpeg", .55);
  const meta = {uid: me.uid, name: me.name, site, cpId: cp?.id ?? null, cpName: cp?.name ?? null, cpDist: cp ? Math.round(dd) : null, cpRadius: cp?.radius ?? null, lat, lng: lon, acc, address, note, deviceTime: now.toISOString(),
    gpsEstado: age > 30 ? "ultima-conocida" : "en-vivo", gpsEdad: age,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone, ua: navigator.userAgent.slice(0, 200), speed: pos.speed ?? null, heading: pos.heading ?? null};
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(photo + JSON.stringify(meta)));
  const hash = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  try {
    await qPut({id: crypto.randomUUID(), meta, photo, thumb, hash, size: photo.length + thumb.length, status: "pendiente", queuedAt: Date.now()});
    $("#note").value = ""; toast(online ? "Foto guardada. Subiendo…" : "Foto guardada en el celular. Se subirá al recuperar conexión.");
    paintQueue(); syncQueue();
  } catch { $("#merr").textContent = "No se pudo guardar la foto en el celular (¿poco espacio?)."; }
  $("#snap").disabled = false;
}

async function loadSites(all) {
  const l = await cached("nepo-sites", async () => (await getDocs(collection(db, "sites"))).docs.map(d => ({id: d.id, ...d.data()})));
  return l.filter(x => all || x.active).sort((a, b) => a.name.localeCompare(b.name));
}

async function loadMine() {
  try {
    const s = await getDocs(query(collection(db, "checkins"), where("uid", "==", me.uid), limit(60)));
    const allMine = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.createdAt?.seconds || 9e9) - (a.createdAt?.seconds || 9e9))
    doneToday = new Set(allMine.filter(r => r.cpId && dayKey(r) === today()).map(r => r.cpId)); paintCps(true);
    const mine = allMine.slice(0, 8); records = mine; $("#mine").innerHTML = mine.map(cardRec).join("") || "<p>Aún no tienes registros.</p>";
    bindRec("#mine");
  } catch {}
}

/* ---------- Registros (admin): carpetas por día ---------- */
const today = () => new Date().toLocaleDateString("sv");
const cardRec = r => `<div class="rec" data-i="${records.indexOf(r)}"><img src="${r.thumb || r.photo}" alt="Foto de registro" loading="lazy">
  <div><b>${esc(r.name)}</b>${r.site ? " · " + esc(r.site) : ""}${r.cpName ? "<br>Punto: " + esc(r.cpName) : ""}${r.diferido ? `<br><span class="tag">Envío diferido</span>` : ""}${r.verifOk === false ? `<br><span class="tag off">Revisar: fuera de zona</span>` : ""}<br>${fmt(r.createdAt?.toDate())}<br>${esc((r.address || `${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}`).slice(0, 60))}</div></div>`;
const bindRec = sel => document.querySelectorAll(sel + " .rec").forEach(e => e.onclick = () => detail(records[e.dataset.i]));

async function detail(r) {
  document.querySelectorAll(".modal").forEach(x => x.remove());
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><div class="pz"><img id="dimg" src="${r.photo || r.thumb}" alt="Foto del registro"></div><p class="hint" id="dst">${r.photo ? "Toca la foto para ampliarla." : "Cargando foto en alta resolución…"}</p>
   <table><tr><th>Guardia</th><td>${esc(r.name)}</td></tr>
   <tr><th>Instalación</th><td>${esc(r.site) || "—"}</td></tr>
   <tr><th>Punto de control</th><td>${r.cpName ? `${esc(r.cpName)} · a ${r.cpDist} m (radio ${r.cpRadius} m)` : "—"}</td></tr>
   <tr><th>Verificación</th><td>${r.verifOk === false ? `Fuera de zona al verificar (a ${r.verifDist} m)` : r.verifOk ? `Dentro de zona (a ${r.verifDist} m)` : "—"}${r.diferido ? " · Envío diferido (capturada sin conexión o con retraso)" : ""}${r.gpsEstado === "ultima-conocida" ? ` · GPS: última ubicación conocida (hace ${r.gpsEdad} s)` : ""}</td></tr>
   <tr><th>Fecha servidor</th><td>${fmt(r.createdAt?.toDate())}</td></tr>
   <tr><th>Hora dispositivo</th><td>${fmt(new Date(r.deviceTime))} (${esc(r.tz)})</td></tr>
   <tr><th>Coordenadas</th><td>${r.lat.toFixed(6)}, ${r.lng.toFixed(6)} · precisión ±${Math.round(r.acc)} m</td></tr>
   <tr><th>Dirección</th><td>${esc(r.address) || "—"}</td></tr>
   <tr><th>Observación</th><td>${esc(r.note) || "—"}</td></tr>
   <tr><th>Dispositivo</th><td class="mono">${esc(r.ua)}</td></tr>
   <tr><th>Huella SHA-256</th><td class="mono">${esc(r.hash)}</td></tr></table>
   <div class="row" style="margin-top:.8rem"><a class="btn" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat},${r.lng}">Ver en mapa</a>
   <a class="btn alt" id="dfull" style="display:none;text-decoration:none" target="_blank" rel="noopener">Abrir foto completa</a><a class="btn alt" id="ddl" style="display:none;text-decoration:none">Descargar foto</a>
   <button class="alt" id="cl">Cerrar</button></div></div>`;
  m.onclick = e => { if (e.target === m || e.target.id === "cl") m.remove(); };
  document.body.appendChild(m);
  const img = m.querySelector("#dimg"), st = m.querySelector("#dst"); img.onclick = () => img.classList.toggle("zoomed");
  let photo = r.photo;
  if (!photo) { try { const d = await Promise.race([getDoc(doc(db, "checkinPhotos", r.id)), new Promise((_, no) => setTimeout(() => no({code: "tiempo agotado"}), 20000))]);
      photo = d.data()?.photo; } catch (e) { st.textContent = `No se pudo cargar la foto completa (${e.code || "error"}). Se muestra la miniatura.`; } }
  if (photo && m.isConnected) { img.src = photo; st.textContent = "Toca la foto para ampliarla y desplázate para ver los datos.";
    try { const url = URL.createObjectURL(await (await fetch(photo)).blob()), f = m.querySelector("#dfull"), dl = m.querySelector("#ddl");
      f.href = url; dl.href = url; dl.download = `registro-${dayKey(r)}-${safe(r.name)}.jpg`; f.style.display = dl.style.display = ""; } catch {} }
}

const fill = (sel, label, arr) => { const prev = $(sel).value;
  $(sel).innerHTML = `<option value="">${label}</option>` + [...new Set(arr)].sort().map(n => `<option>${esc(n)}</option>`).join(""); $(sel).value = prev; };

const CUOTA_BYTES = 1e9; // cupo gratuito de Firestore (1 GiB), usado con margen
const dayKey = r => r.createdAt?.toDate().toLocaleDateString("sv") || today();
const safe = t => String(t || "sin-dato").replace(/[\\/:*?"<>|]+/g, "-").trim();
const csvOf = rows => {
  const head = ["Guardia", "Instalacion", "Punto_control", "Distancia_m", "Verificacion", "Fecha servidor", "Hora dispositivo", "Latitud", "Longitud", "Precision_m", "Direccion", "Observacion", "Hash"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return "\ufeff" + [head.join(","), ...rows.map(r => [r.name, r.site, r.cpName, r.cpDist, r.verifOk === false ? "FUERA DE ZONA" : r.diferido ? "Diferido" : "OK", fmt(r.createdAt?.toDate()), r.deviceTime, r.lat, r.lng, Math.round(r.acc), r.address, r.note, r.hash].map(q).join(","))].join("\n");
};
const download = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); };

async function usageHtml() {
  let u = {bytes: 0, count: 0};
  try { const d = await getDoc(doc(db, "stats", "usage")); if (d.exists()) u = d.data(); } catch {}
  const used = Math.min(100, Math.max(0, u.bytes / CUOTA_BYTES * 100)), free = 100 - used, avg = u.count > 0 ? u.bytes / u.count : 150000;
  const left = Math.max(0, Math.floor((CUOTA_BYTES - u.bytes) / avg));
  const col = free > 40 ? "var(--ok)" : free > 15 ? "var(--gold)" : "var(--bad)";
  const msg = free > 40 ? "Todo en orden. Respalda cuando quieras." : free > 15 ? "Atención: conviene respaldar y liberar los días más antiguos." : "Espacio crítico: respalda y libera espacio hoy.";
  return `<div class="card"><b style="color:var(--blue);font-size:1.1rem">Espacio libre: ${free.toFixed(1)}%</b>
    <small> (estimado · ${(u.bytes / 1e6).toFixed(0)} de ${CUOTA_BYTES / 1e6} MB usados · ${u.count} registros · caben ~${left.toLocaleString("es-CL")} más)</small>
    <div class="bar" style="margin:.5rem 0"><i style="width:${used}%;background:${col}"></i></div><div class="hint" style="margin:0">${msg}</div></div>`;
}

async function buildZip(rows, name) {
  if (!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  const z = new JSZip(), meta = [], queue = rows.slice(); let done = 0;
  const work = async () => { while (queue.length) {
    const r = queue.shift(); let photo = r.photo;
    if (!photo) { try { photo = (await getDoc(doc(db, "checkinPhotos", r.id))).data().photo; } catch { photo = r.thumb; } }
    const t = r.createdAt?.toDate() || new Date(r.deviceTime);
    const path = `${dayKey(r)}/${safe(r.site)}/${safe(r.name)}/${t.toTimeString().slice(0, 8).replace(/:/g, "")}_${r.id.slice(0, 5)}.jpg`;
    z.file(path, photo.split(",")[1], {base64: true});
    const {photo: _p, thumb: _t, ...rest} = r; meta.push({archivo: path, ...rest, createdAt: t.toISOString()});
    $("#bmsg").textContent = `Preparando respaldo… ${++done} de ${rows.length} fotos`;
  }};
  await Promise.all(Array.from({length: 6}, work));
  z.file("registros.csv", csvOf(rows)); z.file("registros.json", JSON.stringify(meta, null, 1));
  download(await z.generateAsync({type: "blob"}), `respaldo-nepo-${name}.zip`);
  $("#bmsg").textContent = "✓ Respaldo descargado. Revisa que el ZIP abra bien antes de liberar espacio.";
}

async function viewRecords() {
  $("#v").innerHTML = `<div id="usage"></div>
    <details class="tip"><summary><b>Guía rápida del administrador</b></summary><ol>
    <li>Elige el rango de fechas y pulsa <b>Buscar</b>. Cada día aparece como una carpeta 📁.</li>
    <li>Filtra por guardia o instalación. Toca una foto para ver su ficha completa, el mapa y la huella de verificación.</li>
    <li><b>Informe PDF</b>: resumen imprimible con los filtros activos.</li>
    <li><b>Respaldo</b>: dentro de cada carpeta, «Respaldar este día» descarga un ZIP ordenado como Día / Instalación / Guardia / foto.jpg, con planilla CSV.</li>
    <li><b>Liberar espacio</b> se habilita solo después de respaldar. Verifica que el ZIP abra bien antes de confirmar.</li>
    <li>Cuando el indicador de espacio baje de 15 %, respalda y libera los días más antiguos.</li></ol></details>
    <div class="card"><div class="row">
    <div><label>Desde</label><input type="date" id="fd" value="${today()}"></div>
    <div><label>Hasta</label><input type="date" id="fh" value="${today()}"></div>
    <div><label>Guardia</label><select id="fg"></select></div>
    <div><label>Instalación</label><select id="fs"></select></div>
    <button id="bs">Buscar</button></div>
    <div class="row" style="margin-top:.8rem;align-items:center"><label style="display:flex;gap:.4rem;align-items:center;margin:0"><input type="checkbox" id="pf" checked style="width:auto"> Fotos en el PDF</label>
    <button id="pdf" class="gold">Informe PDF</button><button id="csv" class="alt">Exportar CSV</button><button id="zipall" class="alt">⬇ Respaldar lo mostrado</button></div>
    <p class="hint" id="bmsg" style="margin-bottom:0"></p></div>
    <div class="stats" id="stats"></div><div id="list"></div>`;
  const refreshUsage = () => usageHtml().then(h => $("#usage").innerHTML = h); refreshUsage();
  let all = []; const backed = new Set();
  const draw = () => {
    const g = $("#fg").value, st = $("#fs").value, days = {};
    records = all.filter(r => (!g || r.name === g) && (!st || r.site === st));
    records.forEach(r => (days[dayKey(r)] ||= []).push(r));
    $("#stats").innerHTML = [["Registros", records.length], ["Guardias", new Set(records.map(r => r.name)).size],
      ["Instalaciones", new Set(records.map(r => r.site).filter(Boolean)).size], ["Días", Object.keys(days).length]]
      .map(([t, n]) => `<div class="stat"><b>${n}</b><small>${t}</small></div>`).join("");
    $("#list").innerHTML = Object.keys(days).sort().reverse().map((k, i) => `<details class="card" ${i === 0 ? "open" : ""}>
      <summary>📁 <b>${new Date(k + "T12:00:00").toLocaleDateString("es-CL", {weekday: "long", day: "numeric", month: "long", year: "numeric"})}</b> · ${days[k].length} registros</summary>
      <div class="row" style="margin-top:.8rem;align-items:center"><button class="sm gold" data-bk="${k}">⬇ 1. Respaldar este día (ZIP)</button>
      <button class="sm alt" data-del="${k}" ${backed.has(k) ? "" : "disabled"}>2. Liberar espacio</button></div>
      <p class="hint">El respaldo y la liberación incluyen todos los registros de ese día, sin importar los filtros.</p>
      <div class="grid">${days[k].map(cardRec).join("")}</div></details>`).join("") || `<div class="card"><p>No hay registros con esos filtros. Prueba ampliando el rango de fechas.</p></div>`;
    bindRec("#list");
    document.querySelectorAll("[data-bk]").forEach(b => b.onclick = async () => { const k = b.dataset.bk; b.disabled = true;
      try { await buildZip(all.filter(r => dayKey(r) === k), k); backed.add(k); document.querySelector(`[data-del="${k}"]`).disabled = false; }
      catch { toast("No se pudo crear el respaldo."); } b.disabled = false; });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const k = b.dataset.del, rows = all.filter(r => dayKey(r) === k);

      try {
        for (let i = 0; i < rows.length; i += 200) { const bt = writeBatch(db);
          rows.slice(i, i + 200).forEach(r => { bt.delete(doc(db, "checkins", r.id)); bt.delete(doc(db, "checkinPhotos", r.id)); }); await bt.commit(); }
        const bytes = rows.reduce((t, r) => t + (r.size || (r.thumb?.length || 0) + (r.photo?.length || 150000)), 0);
        all = all.filter(r => dayKey(r) !== k); draw(); toast("Espacio liberado ✓");
        try { const ref = doc(db, "stats", "usage"), cur = (await getDoc(ref)).data() || {bytes: 0, count: 0};
          await setDoc(ref, {bytes: Math.max(0, cur.bytes - bytes), count: Math.max(0, cur.count - rows.length)}); } catch {}
        refreshUsage();
      } catch (e) { toast("No se pudo eliminar (" + (e.code || "error") + "). Intenta de nuevo."); } });
  };
  const load = async () => {
    const d = $("#fd").value, h = $("#fh").value;
    if (!d || !h || h < d) return toast("Revisa las fechas.");
    if ((new Date(h) - new Date(d)) / 864e5 > 31) return toast("El rango máximo es 31 días.");
    $("#list").innerHTML = "<p>Cargando…</p>";

const shrink = (u, q = .6) => new Promise(ok => { const i = new Image(); i.onload = () => { const c = document.createElement("canvas"); c.width = i.width; c.height = i.height;
  c.getContext("2d").drawImage(i, 0, 0); ok(c.toDataURL("image/jpeg", q)); }; i.onerror = () => ok(u); i.src = u; });
const loadScript = u => new Promise((ok, no) => { const e = document.createElement("script"); e.src = u; e.onload = ok; e.onerror = no; document.head.appendChild(e); });

async function makePdf(rows, f) {
  if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const P = new window.jspdf.jsPDF({unit: "mm", format: "a4"}), W = 210, M = 14;
  const logo = await new Promise(ok => { const i = new Image(); i.onload = () => { const c = document.createElement("canvas"); c.width = i.width; c.height = i.height;
    c.getContext("2d").drawImage(i, 0, 0); ok({u: c.toDataURL("image/jpeg", .9), r: i.width / i.height}); }; i.onerror = () => ok(null); i.src = "logo.jpg"; });
  const head = () => {
    P.setFillColor(27, 69, 144); P.rect(0, 0, W, 26, "F"); P.setFillColor(184, 152, 74); P.rect(0, 26, W, 1.5, "F");
    if (logo) P.addImage(logo.u, "JPEG", M, 3, 20 * logo.r, 20);
    P.setTextColor(255); P.setFont("helvetica", "bold"); P.setFontSize(15); P.text("Informe de registros de presencia", W - M, 12, {align: "right"});
    P.setFont("helvetica", "normal"); P.setFontSize(9); P.text("NEPO Security · Sistema de Georreferenciación", W - M, 19, {align: "right"});
  };
  head(); let y = 36; P.setTextColor(75, 75, 72); P.setFontSize(9);
  P.text(`Periodo: ${f.d} al ${f.h}   ·   Guardia: ${f.g || "todos"}   ·   Instalación: ${f.s || "todas"}`, M, y); y += 5;
  P.text(`Total: ${rows.length} registros   ·   Generado: ${fmt(new Date())} por ${me.name}`, M, y); y += 6;
  const cov = [];
  for (const st of [...new Set(rows.map(r => r.site).filter(Boolean))]) { try {
    const sn = await getDocs(query(collection(db, "checkpoints"), where("site", "==", st)));
    sn.docs.map(d => ({id: d.id, ...d.data()})).filter(c => c.active !== false).forEach(c => cov.push({st, name: c.name, n: rows.filter(r => r.cpId === c.id).length})); } catch {} }
  if (cov.length) {
    P.setFont("helvetica", "bold"); P.setFontSize(10); P.setTextColor(27, 69, 144); P.text("Cobertura de puntos de control (según los filtros del informe)", M, y); y += 5;
    P.setFont("helvetica", "normal"); P.setFontSize(8.5);
    cov.forEach(c => { if (y > 280) { P.addPage(); head(); y = 36; }
      P.setTextColor(...(c.n ? [46, 125, 79] : [179, 38, 30]));
      P.text(`${c.n ? "Cumplido" : "SIN REGISTRO"}  ·  ${c.st} · ${c.name}  (${c.n} registro${c.n === 1 ? "" : "s"})`, M, y); y += 4.2; });
    y += 4; P.setTextColor(75, 75, 72);
  }
  const imgs = {};
  if (f.photos) { const q = rows.slice(); let n = 0;
    await Promise.all(Array.from({length: 5}, async () => { while (q.length) { const r = q.shift(); let p = r.photo;
      if (!p) { try { p = (await getDoc(doc(db, "checkinPhotos", r.id))).data().photo; } catch {} }
      if (p) imgs[r.id] = await shrink(p);
      $("#bmsg").textContent = `Preparando fotos del informe… ${++n} de ${rows.length}`; } }));
    $("#bmsg").textContent = ""; }
  rows.slice().sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)).forEach(r => {
    const im = f.photos ? (imgs[r.id] || r.thumb) : null, ip = im ? P.getImageProperties(im) : null;
    let pw = 88, ph = ip ? pw * ip.height / ip.width : 0; if (ph > 105) { ph = 105; pw = ph * ip.width / ip.height; }
    const withPh = !!im, tx = withPh ? M + pw + 5 : M;
    const L = [...(r.cpName ? [`Punto de control: ${r.cpName} (a ${r.cpDist} m del punto)`] : []), fmt(r.createdAt?.toDate()) + " (hora del servidor)", ...(r.diferido ? [`Envío diferido. Capturada: ${fmt(new Date(r.deviceTime))} (hora del dispositivo)`] : []), ...(r.verifOk === false ? [`REVISAR: fuera de zona al verificar (a ${r.verifDist} m)`] : []), `GPS: ${r.lat.toFixed(6)}, ${r.lng.toFixed(6)} (±${Math.round(r.acc)} m)`,
      ...P.splitTextToSize(`Dirección: ${r.address || "—"}`, W - M - tx), ...(r.note ? P.splitTextToSize(`Obs.: ${r.note}`, W - M - tx) : []), `SHA-256: ${r.hash.slice(0, 32)}...`];
    const bh = Math.max(ph + 5, 13 + L.length * 4.2 + 3);
    if (y + bh > 283) { P.addPage(); head(); y = 36; }
    P.setDrawColor(223, 224, 217); P.line(M, y, W - M, y);
    if (withPh) P.addImage(im, "JPEG", M, y + 2, pw, ph);
    P.setFont("helvetica", "bold"); P.setFontSize(10); P.setTextColor(27, 69, 144); P.text(`${r.name} · ${r.site || "Sin instalación"}`, tx, y + 7);
    P.setFont("helvetica", "normal"); P.setFontSize(8.5); P.setTextColor(75, 75, 72);
    L.forEach((t, i) => P.text(t, tx, y + 12 + i * 4.2));
    y += bh;
  });
  const n = P.getNumberOfPages();
  for (let i = 1; i <= n; i++) { P.setPage(i); P.setFontSize(8); P.setTextColor(120); P.text(`Página ${i} de ${n}`, W / 2, 291, {align: "center"}); }
  P.save(`informe-nepo-${f.d}_${f.h}.pdf`);
}

/* ---------- Mapas y puntos de control ---------- */
const hav = (a, b, c, d) => { const R = 6371000, r = x => x * Math.PI / 180, dp = r(c - a), dl = r(d - b);
  return 2 * R * Math.asin(Math.sqrt(Math.sin(dp / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dl / 2) ** 2)); };
const isDone = id => doneToday.has(id) || queuedCps.has(id);
let userPicked = false, queuedCps = new Set(), cps = [], gm = null, gmP = null, gl = null, doneToday = new Set(), fitMap = true;

async function makeMap(el, c, z = 17) {
  if (!window.L) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l);
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"); }
  const m = L.map(el).setView(c, z);
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19, attribution: "Imagery © Esri"});
  const calle = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "© OpenStreetMap"});
  calle.addTo(m); L.control.layers({"Calle": calle, "Satélite": sat}).addTo(m);
  return m;
}

  draw();
}

async function loadCps(site) {
  cps = []; fitMap = true;
  if (site) cps = (await fetchCps(site)).filter(c => c.active !== false).sort((a, b) => a.name.localeCompare(b.name));
  $("#cps").classList.toggle("hide", !site); paintCps(true);
}

let lastPaint = 0, cpSig = null, mapSig = null, gPosM = null;
async function paintCps(force) {
  const sel = $("#cp"); if (!sel || $("#cps").classList.contains("hide")) return;
  if (!force && Date.now() - lastPaint < 1500) return; lastPaint = Date.now();
  $("#mapd").style.display = cps.length ? "" : "none";
  const sig = cps.map(c => c.id + (isDone(c.id) ? 1 : 0)).join("|");
  if (sig !== cpSig) { const cur = sel.value; cpSig = sig;   // solo se reconstruye el menú si cambian los puntos
    sel.innerHTML = `<option value="">${cps.length ? "Elige el punto de control…" : "Esta instalación no tiene puntos: registro libre"}</option>` +
      cps.map(c => `<option value="${c.id}">${isDone(c.id) ? "✓ " : ""}${esc(c.name)}</option>`).join("");
    sel.value = cur; }
  if (!userPicked && pos && cps.length && document.activeElement !== sel) {
    const id = cps.map(c => ({c, d: hav(pos.latitude, pos.longitude, c.lat, c.lng)})).sort((a, b) => a.d - b.d)[0].c.id;
    if (sel.value !== id) sel.value = id; }
  const c = cps.find(x => x.id === sel.value);
  let cls = "", msg = "";
  if (!cps.length) msg = "Esta instalación no tiene puntos: puedes registrar libremente.";
  else if (!pos) msg = "Buscando tu ubicación…";
  else if (c) { const d = hav(pos.latitude, pos.longitude, c.lat, c.lng);
    if (d - pos.accuracy <= c.radius) { cls = "ok"; msg = `<b>${esc(c.name)}</b><br>Listo para registrar ✓`; }
    else { cls = "bad"; msg = `<b>${esc(c.name)}</b><br>Acércate: estás a ${Math.round(d)} m (máximo ${c.radius} m)`; } }
  else msg = "Elige el punto de control.";
  msg += cps.length ? `<small>Puntos de hoy: ${cps.filter(x => isDone(x.id)).length} de ${cps.length}</small>` : "";
  if ($("#cpd").innerHTML !== msg) $("#cpd").innerHTML = msg;
  $("#cpd").className = "banner " + cls;
  if (!cps.length || !$("#mapd").open) return;
  gmP ||= makeMap($("#gmap"), [cps[0].lat, cps[0].lng], 18).then(m => { gl = L.layerGroup().addTo(m); setTimeout(() => m.invalidateSize(), 80); return m; });
  gm = await gmP;
  const ms = sig + "#" + sel.value;
  if (ms !== mapSig) { mapSig = ms; gl.clearLayers();    // los puntos se redibujan solo si cambian
    cps.forEach(x => { const col = isDone(x.id) ? "#2e7d4f" : "#B8984A";
      L.circle([x.lat, x.lng], {radius: x.radius, color: col, weight: x.id === sel.value ? 4 : 2, fillOpacity: .2}).addTo(gl);
      L.circleMarker([x.lat, x.lng], {radius: 6, color: col, fillOpacity: 1}).bindTooltip(x.name).addTo(gl); }); }
  if (pos) { const ll = [pos.latitude, pos.longitude]; if (gPosM) gPosM.setLatLng(ll); else gPosM = L.circleMarker(ll, {radius: 8, color: "#1B4590", fillOpacity: 1}).addTo(gm); }
  if (fitMap) { fitMap = false; const pts = cps.map(x => [x.lat, x.lng]); if (pos) pts.push([pos.latitude, pos.longitude]); gm.fitBounds(pts, {padding: [30, 30], maxZoom: 19}); }
}

    const ss = await loadSites(true);
    $("#sl").innerHTML = ss.map(x => `<div class="row" style="align-items:center;border-bottom:1px solid var(--line);padding:.4rem 0"><span><b>${esc(x.name)}</b> <span class="tag ${x.active ? "" : "off"}">${x.active ? "Activa" : "Desactivada"}</span></span>
      <button class="sm alt" data-t="${x.id}" data-a="${x.active}">${x.active ? "Desactivar" : "Activar"}</button><button class="sm alt danger" data-x="${x.id}" data-n="${esc(x.name)}">Eliminar</button></div>`).join("") || "<p>Aún no hay instalaciones. Agrega la primera.</p>";
    document.querySelectorAll("#sl [data-t]").forEach(b => b.onclick = async () => { await updateDoc(doc(db, "sites", b.dataset.t), {active: b.dataset.a !== "true"}); drawSites(); });
    document.querySelectorAll("#sl [data-x]").forEach(b => b.onclick = async () => {
      const n = b.dataset.n;
      if (!confirm(`¿Eliminar la instalación «${n}»?\n\nSe borran también sus puntos de control y se quita de los guardias asignados. Los registros ya hechos se conservan.`)) return;
      try {
        const bt = writeBatch(db);
        (await getDocs(query(collection(db, "checkpoints"), where("site", "==", n)))).docs.forEach(d => bt.delete(d.ref));
        (await getDocs(collection(db, "users"))).docs.forEach(d => { const l = d.data().sites || []; if (l.includes(n)) bt.update(d.ref, {sites: l.filter(x => x !== n)}); });
        bt.delete(doc(db, "sites", b.dataset.x)); await bt.commit();
        localStorage.removeItem("nepo-cps-" + n); toast("Instalación eliminada ✓"); viewUsers();
      } catch { toast("No se pudo eliminar."); } });
  };
  $("#sc").onclick = async () => { const n = $("#sn").value.trim(); if (!n) return; await addDoc(collection(db, "sites"), {name: n, active: true}); $("#sn").value = ""; drawSites(); };
  drawSites();
}

window.addEventListener("online", () => { netBadge(); toast("Conexión recuperada. Subiendo pendientes…"); syncQueue(); });
window.addEventListener("offline", () => { netBadge(); toast("Sin conexión. Las fotos se guardarán en el celular."); paintQueue(); });
setInterval(() => syncQueue(), 30000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- Instalar como app (PWA) ---------- */
let deferredInstall = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function showInstall() { document.querySelectorAll(".inst").forEach(b => b.classList.toggle("hide", !!standalone())); }
async function installApp() {
  if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; return showInstall(); }
  const ua = navigator.userAgent, inApp = /FBAN|FBAV|Instagram|Line\/|; wv\)|WhatsApp/i.test(ua);
  const steps = isIOS
    ? `<li>Abre esta página en <b>Safari</b> (no en Chrome).</li><li>Toca <b>Compartir</b> (cuadrado con flecha hacia arriba).</li><li>Elige <b>Agregar a pantalla de inicio</b> y pulsa <b>Agregar</b>.</li>`
    : /Android/i.test(ua)
    ? `<li>Abre esta página en <b>Chrome</b>.</li><li>Toca el menú <b>⋮</b> (arriba a la derecha).</li><li>Elige <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b>.</li>`
    : `<li>Usa <b>Chrome</b> o <b>Edge</b>.</li><li>Busca el ícono de instalar al final de la barra de direcciones, o el menú <b>⋮</b> → <b>Instalar NEPO</b>.</li>`;
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h2>Instalar NEPO como app</h2>
    ${inApp ? `<p class="err">Estás dentro de otra app (WhatsApp, Instagram, etc.). Abre el enlace en Chrome o Safari para poder instalar.</p>` : ""}
    <ol style="line-height:1.8">${steps}</ol>
    <details style="margin:.6rem 0"><summary>Revisar por qué no se instala solo</summary><div id="dg" class="hint">Revisando…</div></details>
    <button id="cl" style="width:100%">Entendido</button></div>`;
  m.onclick = e => { if (e.target === m || e.target.id === "cl") m.remove(); }; document.body.appendChild(m);
  const ok = async u => { try { return (await fetch(u, {cache: "no-store"})).ok; } catch { return false; } };
  const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
  const rows = [["Conexión segura (HTTPS)", location.protocol === "https:"], ["Archivo manifest.json encontrado", await ok("manifest.json")],
    ["Ícono icons/icon-192.png encontrado", await ok("icons/icon-192.png")], ["Ícono icons/icon-512.png encontrado", await ok("icons/icon-512.png")],
    ["Archivo sw.js encontrado", await ok("sw.js")], ["Service worker activo", !!reg], ["Navegador compatible", isIOS || "BeforeInstallPromptEvent" in window]];
  $("#dg") && ($("#dg").innerHTML = rows.map(([t, v]) => `${v ? "✓" : "✗"} ${t}`).join("<br>") + (rows.some(r => !r[1]) ? "<br><br>Lo que tenga ✗ falta o está mal subido al repositorio." : "<br><br>Todo está correcto: usa el menú del navegador para instalar."));
}
document.addEventListener("click", e => { if (e.target.closest(".inst")) installApp(); });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; showInstall(); });
window.addEventListener("appinstalled", () => { deferredInstall = null; showInstall(); toast("App instalada ✓"); });
</script>
</body>
</html>
